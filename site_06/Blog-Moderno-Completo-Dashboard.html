te:"18 Mai 2026",read:"8 min",emoji:"\uD83E\uDD16",grad:"linear-gradient(135deg,#7C3AED,#C084FC)",excerpt:"Do rascunho ao relatório final: um guia prático para usar IA sem perder autoria, critério e voz própria.",content:["A inteligência artificial deixou de ser uma promessa distante. Hoje ela aparece no editor de texto, na planilha, no atendimento e até no brainstorm de segunda-feira. O desafio não é mais acessar a ferramenta — é usá-la com intenção.","Neste artigo, organizamos um fluxo simples em três tempos: preparar, provocar e revisar. Primeiro, defina o objetivo em uma frase. Depois, peça variações e contra-argumentos. Por fim, revise como um editor experiente: corte o óbvio, mantenha o que tem textura humana.","Quem aprende a dirigir a máquina ganha tempo para o que realmente importa: pensar, conversar e criar. O resto é repetição — e repetição a IA faz muito bem."],tags:["IA","Produtividade","Futuro"],likes:342,comments:[{name:"Rafael",text:"O fluxo em 3 tempos mudou minha rotina. Ótimo artigo!",time:"hoje"}],status:"Publicado",views:"4.8k"},{id:2,title:"Design que converte: 7 princípios para interfaces memoráveis",cat:"Design",author:"Lucas Ferreira",role:"Designer Sênior",date:"15 Mai 2026",read:"6 min",emoji:"\uD83C\uDFA8",grad:"linear-gradient(135deg,#FF6B35,#FFB86B)",excerpt:"Hierarquia, contraste e respiro. O que separa um layout bonito de um produto que as pessoas lembram.",content:["Bom design não grita. Ele orienta. Antes de qualquer cor ou fonte, pergunte: qual é a próxima ação da pessoa? Se a resposta não estiver óbvia em 3 segundos, o layout precisa de cirurgia.","Espaço em branco é decisão, não ausência. Tipografia grande cria hierarquia. Um único acento de cor pode guiar o olhar melhor do que dez botões coloridos.","Teste com pessoas reais, observe onde elas hesitam e repita. Interfaces memoráveis são construídas em iterações, não em um único golpe de inspiração."],tags:["UI","UX","Branding"],likes:218,comments:[],status:"Publicado",views:"3.2k"},{id:3,title:"Rituais matinais de quem cria: pequenas rotinas, grande energia",cat:"Lifestyle",author:"Ana Souza",role:"Colunista",date:"12 Mai 2026",read:"5 min",emoji:"\uD83C\uDF05",grad:"linear-gradient(135deg,#059669,#34D399)",excerpt:"Sem fórmulas mágicas: como criar uma manhã que cabe na sua vida real e devolve foco para o dia.",content:["Acordar cedo não é a resposta. Acordar com intenção, sim. Comece escolhendo duas coisas que você fará antes do celular: água, luz do dia, uma página escrita à mão.","Rotinas boas são pequenas, repetíveis e gentis. Se falhar um dia, retome no próximo sem culpa. Consistência não é perfeição — é retorno.","O segredo está no design do ambiente: deixe o livro à vista, o tênis pronto, a xícara ao lado da cafeteira. O futuro eu agradece."],tags:["Rotina","Bem-estar","Foco"],likes:176,comments:[],status:"Publicado",views:"2.9k"},{id:4,title:"Como lançar um produto digital com orçamento enxuto",cat:"Negócios",author:"Pedro Almeida",role:"Fundador",date:"10 Mai 2026",read:"9 min",emoji:"\uD83D\uDE80",grad:"linear-gradient(135deg,#2563EB,#60A5FA)",excerpt:"Valide antes de construir, venda antes de escalar. Um roteiro honesto para quem está começando.",content:["A maioria dos produtos não falha por falta de código. Falha por falta de conversa. Antes de qualquer linha, fale com 20 pessoas com o problema que você quer resolver.","Crie uma página, um protótipo e uma oferta. Se ninguém quiser pagar ou se comprometer, você economizou meses de trabalho.","Com orçamento enxuto, o marketing é comunidade: ensine, compartilhe o bastidor e construa em público. Confiança é o melhor canal de aquisição."],tags:["Startup","Vendas","MVP"],likes:294,comments:[],status:"Publicado",views:"5.1k"},{id:5,title:"Lisboa em 48 horas: o roteiro que cabe no bolso e no coração",cat:"Viagens",author:"Beatriz Lima",role:"Repórter de Viagem",date:"08 Mai 2026",read:"7 min",emoji:"✈️",grad:"linear-gradient(135deg,#DB2777,#F472B6)",excerpt:"Tram 28, pastel de nata, miradouros e bairros que pedem para ser caminhados sem pressa.",content:["Lisboa se entende a pé. Comece no Alfama ao amanhecer, quando as vielas ainda estão silenciosas e o cheiro de café toma conta das esquinas.","No segundo dia, atravesse para Belém de tram, prove um pastel ainda morno e termine o dia no miradouro com o Tejo pintado de dourado.","Dica de ouro: compre o passe de transporte, leve tênis confortável e guarde espaço na mala para livros e cerâmica local."],tags:["Europa","Roteiro","Cidades"],likes:401,comments:[],status:"Publicado",views:"6.3k"},{id:6,title:"O novo front-end: menos frameworks, mais fundamentos",cat:"Tecnologia",author:"Marina Duarte",role:"Editora de Tecnologia",date:"05 Mai 2026",read:"10 min",emoji:"⚡",grad:"linear-gradient(135deg,#111827,#7C3AED)",excerpt:"Por que times maduros estão voltando ao básico — e entregando sites mais rápidos, leves e fáceis de manter.",content:["A moda passa, o fundamento fica. HTML semântico, CSS bem arquitetado e JavaScript enxuto ainda resolvem 90% dos problemas reais.","Framework é ferramenta, não identidade. A pergunta certa não é “qual está na moda?”, e sim “qual remove complexidade do meu time?”.","Performance é uma feature. Cada kilobyte a menos é um segundo a menos de espera — e uma pessoa a mais que fica."],tags:["Frontend","Performance","Web"],likes:267,comments:[],status:"Publicado",views:"4.1k"},{id:7,title:"Paleta, fonte e voz: construindo uma marca que parece gente",cat:"Design",author:"Lucas Ferreira",role:"Designer Sênior",date:"02 Mai 2026",read:"6 min",emoji:"✨",grad:"linear-gradient(135deg,#F59E0B,#FF6B35)",excerpt:"Marcas memoráveis não vendem apenas produtos — elas têm opinião, humor e ritmo próprios.",content:["Escolha três adjetivos para a sua marca e seja fiel a eles em tudo: no botão, no e-mail, no erro 404. Consistência cria familiaridade.","Uma paleta forte não precisa de muitas cores. Precisa de uma principal com personalidade, uma neutra que dê respiro e um acento para os momentos de ação."],tags:["Marca","Visual","Identidade"],likes:189,comments:[],status:"Rascunho",views:"1.2k"},{id:8,title:"Trabalho remoto que funciona: acordos, não controle",cat:"Negócios",author:"Pedro Almeida",role:"Fundador",date:"28 Abr 2026",read:"7 min",emoji:"\uD83C\uDFE1",grad:"linear-gradient(135deg,#0EA5E9,#7C3AED)",excerpt:"Transparência, documentação e ritmos claros valem mais que qualquer ferramenta de vigilância.",content:["Equipes remotas não precisam de mais reuniões. Precisam de melhores acordos: quando respondemos, onde documentamos e como decidimos.","Escreva o óbvio. O que está só na sua cabeça não existe para o time. Documentação é a forma mais gentil de escalar."],tags:["Remoto","Gestão","Cultura"],likes:143,comments:[],status:"Publicado",views:"2.4k"},{id:9,title:"A arte de viajar leve: uma mochila, 10 dias, zero estresse",cat:"Viagens",author:"Beatriz Lima",role:"Repórter de Viagem",date:"25 Abr 2026",read:"5 min",emoji:"\uD83C\uDF92",grad:"linear-gradient(135deg,#10B981,#F59E0B)",excerpt:"Capsule wardrobe, tecnologia mínima e a liberdade de não despachar nada.",content:["Viajar leve começa em casa, na hora de decidir o que realmente importa. Três partes de baixo, cinco de cima, um casaco. O resto é peso.","Use sacos organizadores, digitalize documentos e leve uma mochila que caiba embaixo do assento. Você vai atravessar aeroportos sorrindo."],tags:["Mochilão","Minimalismo","Dicas"],likes:228,comments:[],status:"Publicado",views:"3.8k"},{id:10,title:"Slow living na cidade grande: calma é uma escolha diária",cat:"Lifestyle",author:"Ana Souza",role:"Colunista",date:"20 Abr 2026",read:"6 min",emoji:"\uD83C\uDF43",grad:"linear-gradient(135deg,#84CC16,#059669)",excerpt:"Não é preciso fugir para o campo para viver com mais leveza. Basta redesenhar o ritmo.",content:["Slow living não é fazer menos. É estar presente enquanto faz. Comer sem tela, caminhar sem pressa, conversar sem interromper.","Comece com um ritual por dia: o chá da tarde, a leitura antes de dormir, a janela aberta. Pequenas pausas mudam a textura do dia."],tags:["Calma","Cidade","Equilíbrio"],likes:157,comments:[],status:"Rascunho",views:"900"},{id:11,title:"Design system na prática: do token ao componente vivo",cat:"Design",author:"Lucas Ferreira",role:"Designer Sênior",date:"17 Abr 2026",read:"11 min",emoji:"\uD83E\uDDE9",grad:"linear-gradient(135deg,#7C3AED,#EC4899)",excerpt:"Como manter um sistema que o time realmente usa — sem virar burocracia.",content:["Um design system bom não é uma biblioteca. É um acordo. Comece pelos tokens de cor, espaçamento e tipografia. Depois, pelos componentes que mais se repetem.","Documente com exemplos reais, não com regras abstratas. Mostre quando usar, quando não usar e o que fazer quando nada serve."],tags:["System","Tokens","UI"],likes:312,comments:[],status:"Publicado",views:"4.6k"},{id:12,title:"SEO em 2026: conteúdo útil vence algoritmo",cat:"Tecnologia",author:"Marina Duarte",role:"Editora de Tecnologia",date:"14 Abr 2026",read:"8 min",emoji:"\uD83D\uDD0D",grad:"linear-gradient(135deg,#111827,#FF6B35)",excerpt:"Menos truque, mais resposta. O que o buscador realmente recompensa hoje.",content:["Escreva para a pessoa que tem uma pergunta urgente. Se o seu texto resolve em 30 segundos o que outros demoram 5 minutos para enrolar, você já venceu.","Estruture com títulos claros, responda logo no primeiro parágrafo e use exemplos reais. O algoritmo aprendeu a reconhecer utilidade."],tags:["SEO","Conteúdo","Busca"],likes:275,comments:[],status:"Publicado",views:"5.4k"}],uf=[{name:"São Paulo, BR",origin:"Busca orgânica",page:"IA no cotidiano",time:"há 2 min",device:"Mobile"},{name:"Lisboa, PT",origin:"Instagram",page:"Lisboa em 48 horas",time:"há 9 min",device:"Desktop"},{name:"Rio de Janeiro, BR",origin:"Newsletter",page:"Design que converte",time:"há 14 min",device:"Mobile"},{name:"Belo Horizonte, BR",origin:"Busca orgânica",page:"SEO em 2026",time:"há 21 min",device:"Desktop"},{name:"Porto, PT",origin:"Dire
